<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https: wss: http: ws:; base-uri 'none'; form-action 'none'">
<title>Pulse — Device Control Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234493f8'/%3E%3Cstop offset='1' stop-color='%23a371f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 44V20a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4h-4' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='48' r='2' fill='white'/%3E%3Cpath d='M12 30a12 12 0 0 1 8-11M12 34a16 16 0 0 1 8-15' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' opacity='.9'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#0b0d12; --bg2:#0e1117; --panel:#131722; --panel2:#1a2030; --line:#262e3d; --line2:#323d52;
    --text:#eef2f8; --mute:#8a94a6; --mute2:#6b7485;
    --ok:#3fb950; --warn:#e3b341; --bad:#f85149; --acc:#5b8cff; --acc2:#a371f7;
    --grad:linear-gradient(135deg,var(--acc),var(--acc2));
    --radius:12px; --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
              font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
              background-image:radial-gradient(1200px 500px at 20% -10%, rgba(91,140,255,.09), transparent),
                                radial-gradient(900px 400px at 100% 0%, rgba(163,113,247,.08), transparent); }
  button,input,select,textarea { font:inherit; color:inherit; }
  button { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 13px;
           cursor:pointer; transition:.15s border-color,.15s transform,.15s background; }
  button:hover:not(:disabled) { border-color:var(--acc); }
  button:active:not(:disabled) { transform:scale(.96); }
  button.primary { background:var(--grad); border:none; color:#fff; font-weight:600; box-shadow:0 2px 10px rgba(91,140,255,.35); }
  button.danger { background:#2a1316; border-color:#5a2126; color:#ffb4ae; }
  button.ghost { background:transparent; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input,select,textarea { background:var(--bg2); border:1px solid var(--line); border-radius:9px; padding:8px 11px; outline:none; }
  input:focus,select:focus,textarea:focus { border-color:var(--acc); }

  header { display:flex; align-items:center; gap:12px; padding:11px 18px; background:rgba(19,23,34,.85);
           backdrop-filter:blur(10px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .brand { display:flex; align-items:center; gap:9px; }
  .brand svg { width:28px; height:28px; display:block; }
  .brand b { font-size:16px; letter-spacing:.2px; }
  .brand span.tag { color:var(--mute2); font-size:11px; margin-left:2px; }
  .pill { font-size:11.5px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--mute); white-space:nowrap; }
  .pill.ok { color:var(--ok); border-color:#1e4a28; background:rgba(63,185,80,.08); }
  .pill.bad { color:var(--bad); border-color:#4a1f1f; background:rgba(248,81,73,.08); }
  .pill.warn { color:var(--warn); border-color:#4a3b1a; background:rgba(227,179,65,.08); }
  .pill.live { color:#fff; background:var(--grad); border:none; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.72} }

  #login { max-width:400px; margin:10vh auto 0; background:var(--panel); border:1px solid var(--line);
           border-radius:16px; padding:28px; box-shadow:var(--shadow); }
  #login .brand { justify-content:center; margin-bottom:4px; }
  #login h2 { text-align:center; margin:0 0 2px; font-size:19px; }
  #login .sub { text-align:center; color:var(--mute); font-size:12.5px; margin-bottom:18px; }
  #login label { display:block; margin:13px 0 5px; color:var(--mute); font-size:12.5px; }
  #login input { width:100%; }
  #login button.primary { width:100%; margin-top:18px; padding:10px; }
  #loginErr { color:var(--bad); font-size:12.5px; margin-top:10px; min-height:1em; }

  #app { display:none; height:calc(100% - 52px); }
  .layout { display:grid; grid-template-columns:300px 1fr; height:100%; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:12px; }
  aside .hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:0 2px; }
  aside .hd b { font-size:12.5px; color:var(--mute); text-transform:uppercase; letter-spacing:.5px; }
  .dev { background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:11px;
         margin-bottom:8px; cursor:pointer; transition:.15s border-color,.15s background; }
  .dev:hover { border-color:var(--line2); }
  .dev.sel { border-color:var(--acc); background:linear-gradient(180deg,rgba(91,140,255,.1),rgba(91,140,255,.03)); }
  .dev .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .dev .name { font-weight:600; font-size:13.5px; }
  .dev .meta { color:var(--mute); font-size:11.5px; margin-top:5px; }
  .task { font-size:11px; margin-top:6px; padding:5px 8px; background:var(--bg2); border-radius:7px; border:1px solid var(--line); color:var(--mute); }
  .empty-list { color:var(--mute2); font-size:12.5px; padding:20px 4px; text-align:center; }

  main { display:flex; flex-direction:column; min-width:0; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:9px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .bar .grow { flex:1; }
  .bar label { color:var(--mute); font-size:12px; display:flex; align-items:center; gap:5px; }
  .stage { flex:1; display:flex; justify-content:center; align-items:center; overflow:auto; padding:14px; min-height:0; position:relative;
           background:radial-gradient(600px 300px at 50% 20%, rgba(255,255,255,.02), transparent); }
  canvas { max-width:100%; max-height:100%; background:#000; border-radius:10px; touch-action:none; cursor:crosshair; box-shadow:var(--shadow); }
  #overlay { position:absolute; top:24px; left:24px; background:rgba(10,12,18,.75); backdrop-filter:blur(6px);
             padding:6px 12px; border-radius:9px; font-size:12px; pointer-events:none; border:1px solid var(--line); }
  #empty { color:var(--mute); text-align:center; padding:40px; }
  #empty svg { width:52px; height:52px; opacity:.3; margin-bottom:10px; }
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 14px; border-top:1px solid var(--line); background:var(--panel); }
  .tools .col { display:flex; gap:7px; align-items:flex-start; }
  .tools textarea,.tools input[type=text] { flex:1; min-height:38px; resize:vertical; }
  #toasts { position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:9; max-width:min(420px,90vw); }
  .toast { background:var(--panel2); border:1px solid var(--line); border-left:4px solid var(--acc); padding:9px 13px;
           border-radius:9px; box-shadow:var(--shadow); animation:slide .18s ease-out; }
  @keyframes slide { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .toast.err { border-left-color:var(--bad); } .toast.ok { border-left-color:var(--ok); }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--line2); border-radius:6px; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    aside { max-height:32vh; border-right:0; border-bottom:1px solid var(--line); } .tools { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 64 64"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a371f7"/></linearGradient></defs>
      <rect width="64" height="64" rx="16" fill="url(#hg)"/>
      <path d="M20 44V20a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4h-4" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="32" cy="48" r="2" fill="white"/>
      <path d="M12 30a12 12 0 0 1 8-11M12 34a16 16 0 0 1 8-15" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9"/></svg>
    <b>Pulse</b><span class="tag">Control Center</span>
  </div>
  <span class="grow"></span>
  <span id="connPill" class="pill">logged out</span>
  <button class="ghost" id="logoutBtn" style="display:none">Logout</button>
</header>

<section id="login">
  <div class="brand"><svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a371f7"/></linearGradient></defs>
      <rect width="64" height="64" rx="16" fill="url(#lg)"/>
      <path d="M20 44V20a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4h-4" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="32" cy="48" r="2" fill="white"/>
      <path d="M12 30a12 12 0 0 1 8-11M12 34a16 16 0 0 1 8-15" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9"/></svg></div>
  <h2 style="margin-top:14px">Pulse Control Center</h2>
  <div class="sub">Apne server se connect karein aur apne devices dekhein</div>
  <label for="srv">Server URL</label>
  <input id="srv" placeholder="https://your-app.up.railway.app" autocomplete="off">
  <label for="tok">Admin token</label>
  <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
  <button class="primary" id="loginBtn">Connect →</button>
  <div id="loginErr"></div>
</section>

<div id="app">
  <div class="layout">
    <aside>
      <div class="hd"><b>Devices</b><span id="devCount" class="pill">0</span></div>
      <div id="devList"></div>
    </aside>
    <main>
      <div class="bar">
        <b id="selName">Koi device select nahi</b><span id="selState" class="pill"></span>
        <span class="grow"></span>
        <label>FPS <select id="fps"><option>10</option><option>15</option><option selected>20</option><option>30</option></select></label>
        <label>Quality <select id="quality"><option>low</option><option>medium</option><option selected>high</option><option>ultra</option></select></label>
        <button class="primary" id="watchBtn" disabled>▶ Watch Live</button>
        <button class="danger" id="stopBtn" disabled>■ Stop</button>
        <button id="audioBtn" disabled>🔇 Audio off</button>
        <label>🔊<input type="range" id="volume" min="0" max="100" value="80" style="width:80px"></label>
      </div>
      <div class="bar">
        <button data-key="back" class="keyBtn" disabled>◀ Back</button>
        <button data-key="home" class="keyBtn" disabled>⭘ Home</button>
        <button data-key="recents" class="keyBtn" disabled>▭ Recents</button>
        <button data-key="notifications" class="keyBtn" disabled>🔔 Notifications</button>
        <span class="grow"></span>
        <span id="pingPill" class="pill">—</span>
        <span id="stats" class="pill">—</span>
      </div>
      <div class="stage">
        <div id="empty">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="14" y="10" width="36" height="34" rx="4"/><path d="M26 50h12M32 44v6"/></svg>
          <div>Left se device chuniye, phir <b>Watch Live</b> dabaiye.<br>Screen par click = tap, drag = swipe.</div>
        </div>
        <canvas id="screen" style="display:none"></canvas>
        <div id="overlay" style="display:none"></div>
      </div>
      <div class="tools">
        <div class="col">
          <input type="text" id="typeBox" placeholder="Device ke focused field mein text likhein…" disabled>
          <label style="white-space:nowrap"><input type="checkbox" id="appendChk"> jodo</label>
          <button id="typeBtn" disabled>Type</button>
        </div>
        <div class="col">
          <textarea id="clipBox" placeholder="Yahan paste karein → device ke clipboard mein bhejein" rows="1" disabled></textarea>
          <button id="clipSendBtn" disabled>Bhejo</button>
          <button id="clipReadBtn" disabled>Padho</button>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="toasts"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
let base = '', token = '';
let devices = [], selId = null;
let live = null;       // live screen view state
let ctl = null;        // fast admin control WebSocket (tap/swipe/key/type/clipboard)
let pollTimer = null, statsTimer = null;

// ---------- helpers ----------
function toast(msg, kind) {
  const d = document.createElement('div'); d.className = 'toast ' + (kind || '');
  d.textContent = msg; $('toasts').appendChild(d);
  setTimeout(() => d.remove(), kind === 'err' ? 6000 : 3000);
}
function errText(e) {
  const d = e && e.data;
  return (d && (d.error_code || (d.error && (d.error.message || d.error.code)) || d.message))
    ? [d.error_code, d.message, d.error && d.error.message].filter(Boolean).join(': ')
    : (e.message || String(e));
}
async function api(method, path, body) {
  const res = await fetch(base + path, {
    method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined, cache: 'no-store',
  });
  const text = await res.text(); let data;
  try { data = JSON.parse(text); } catch { data = { raw: text }; }
  if (!res.ok) { const e = new Error((data.message || data.error || res.statusText) + ''); e.status = res.status; e.data = data; throw e; }
  return data;
}
function uuid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); }

// ---------- fast control channel ----------
// Har click/drag/key ke liye alag HTTP request (headers+TLS+auth roundtrip) ki
// jagah ek hi WebSocket — latency bahut kam. HTTP admin route abhi bhi hai
// (fallback + non-interactive commands), par UI isi se chalta hai.
const pendingCtl = new Map();
let ctlReady = null;

function openControl() {
  if (ctl && ctl.readyState <= 1) return ctlReady;
  ctlReady = (async () => {
    const t = await api('POST', '/admin/ws-ticket');
    const url = base.replace(/^http/, 'ws') + '/admin/control?ticket=' + encodeURIComponent(t.ticket);
    const ws = new WebSocket(url);
    ctl = ws;
    await new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = reject; });
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      const p = pendingCtl.get(m.id); if (!p) return;
      pendingCtl.delete(m.id); clearTimeout(p.timer);
      m.ok ? p.resolve(m.result) : p.reject(Object.assign(new Error(m.error || 'command fail'), { data: m }));
    };
    ws.onclose = () => { ctl = null; for (const [, p] of pendingCtl) { clearTimeout(p.timer); p.reject(new Error('control channel closed')); } pendingCtl.clear(); };
  })();
  return ctlReady;
}
function ctlCommand(deviceId, capability, action, params, timeoutMs) {
  return openControl().then(() => new Promise((resolve, reject) => {
    const id = uuid();
    const timer = setTimeout(() => { pendingCtl.delete(id); reject(new Error('timeout')); }, timeoutMs || 10000);
    pendingCtl.set(id, { resolve, reject, timer, sentAt: performance.now() });
    ctl.send(JSON.stringify({ id, device_id: deviceId, capability, action, params: params || {}, timeout_ms: timeoutMs }));
  }));
}
// Ek device par ordered rakhte hain (tap-tap-tap jaldi dabane par flood na ho).
let cmdChain = Promise.resolve(); let pendingCmds = 0;
function command(capability, action, params, timeoutMs) {
  if (!selId) return Promise.reject(new Error('Device select nahi'));
  const id = selId; pendingCmds++; updateStats();
  const run = () => ctlCommand(id, capability, action, params, timeoutMs).finally(() => { pendingCmds--; updateStats(); });
  const p = cmdChain.then(run, run); cmdChain = p.catch(() => {}); return p;
}
// Live ping meter — "signal kaisa hai": browser <-> server control-channel
// round-trip (server seedha pong deta hai, device tak nahi jaata).
async function measurePing() {
  if (!ctl || ctl.readyState !== 1) return;
  try {
    const t0 = performance.now();
    await ctlCommand('_', '__ping', 'ping', {}, 2500);
    const ms = performance.now() - t0;
    $('pingPill').textContent = Math.round(ms) + ' ms';
    $('pingPill').className = 'pill ' + (ms < 100 ? 'ok' : ms < 300 ? 'warn' : 'bad');
  } catch { $('pingPill').textContent = '—'; $('pingPill').className = 'pill'; }
}

// ---------- login ----------
$('srv').value = localStorage.getItem('uda_server') || '';
$('tok').value = sessionStorage.getItem('uda_token') || '';
$('loginBtn').onclick = login;
$('tok').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
$('logoutBtn').onclick = logout;
if ($('srv').value && $('tok').value) login();

async function login() {
  base = $('srv').value.trim().replace(/\/+$/, ''); token = $('tok').value.trim();
  $('loginErr').textContent = '';
  if (!/^https?:\/\//.test(base) || !token) { $('loginErr').textContent = 'Server URL (https://…) aur token dono chahiye'; return; }
  try { await refreshDevices(); }
  catch (e) {
    $('loginErr').textContent = e.status === 401 ? 'Token galat hai' : e.status === 404 ? 'Server par ADMIN_TOKEN set nahi hai' : errText(e);
    return;
  }
  localStorage.setItem('uda_server', base); sessionStorage.setItem('uda_token', token);
  $('login').style.display = 'none'; $('app').style.display = 'block'; $('logoutBtn').style.display = '';
  setPill('connected', 'ok');
  pollTimer = setInterval(() => refreshDevices().catch(() => setPill('server se connection toot gaya', 'bad')), 4000);
  statsTimer = setInterval(() => { updateStats(); measurePing(); }, 1000);
}
function logout() {
  stopLive(true); try { ctl && ctl.close(); } catch {} ctl = null;
  clearInterval(pollTimer); clearInterval(statsTimer);
  sessionStorage.removeItem('uda_token'); token = ''; $('tok').value = '';
  $('app').style.display = 'none'; $('login').style.display = ''; $('logoutBtn').style.display = 'none';
  setPill('logged out', '');
}
function setPill(t, k) { const p = $('connPill'); p.textContent = t; p.className = 'pill ' + (k || ''); }

// ---------- devices ----------
async function refreshDevices() {
  const r = await api('GET', '/admin/devices');
  devices = r.devices || [];
  setPill('connected', 'ok');
  renderDevices();
}
function renderDevices() {
  $('devCount').textContent = devices.length;
  const list = $('devList'); list.textContent = '';
  if (!devices.length) { const e = document.createElement('div'); e.className = 'empty-list'; e.textContent = 'Koi device paired nahi.'; list.appendChild(e); }
  for (const d of devices) {
    const el = document.createElement('div'); el.className = 'dev' + (d.id === selId ? ' sel' : '');
    const row = document.createElement('div'); row.className = 'row';
    const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = d.name || d.id;
    const st = document.createElement('span'); st.className = 'pill ' + (d.connected ? 'ok' : 'bad'); st.textContent = d.connected ? 'ONLINE' : 'OFFLINE';
    row.append(nm, st);
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = [d.platform, d.state, d.battery_percent != null ? d.battery_percent + '% battery' : null,
                        d.active_task_count + ' active task(s)'].filter(Boolean).join(' · ');
    el.append(row, meta);
    for (const t of (d.active_tasks || [])) {
      const tk = document.createElement('div'); tk.className = 'task';
      tk.textContent = (t.state || '') + ' · ' + (t.originating_capability || t.capability || '') + ' · ' + (t.task_id || '').slice(0, 14);
      el.appendChild(tk);
    }
    el.onclick = () => selectDevice(d.id);
    list.appendChild(el);
  }
  const cur = devices.find((x) => x.id === selId);
  if (cur) { $('selName').textContent = cur.name || cur.id; const s = $('selState'); s.textContent = cur.connected ? 'ONLINE' : 'OFFLINE'; s.className = 'pill ' + (cur.connected ? 'ok' : 'bad'); }
  syncButtons();
}
function selectDevice(id) {
  if (live && live.deviceId !== id) stopLive(false);
  selId = id; renderDevices(); openControl().catch(() => {});
}
function syncButtons() {
  const cur = devices.find((x) => x.id === selId);
  const online = !!(cur && cur.connected), isLive = !!(live && !live.stop);
  $('watchBtn').disabled = !online || isLive; $('stopBtn').disabled = !isLive;
  $('audioBtn').disabled = !isLive;
  const audioOn = !!(live && live.audio);
  $('audioBtn').textContent = audioOn ? '🔊 Audio on' : '🔇 Audio off';
  $('audioBtn').className = audioOn ? 'primary' : '';
  for (const b of document.querySelectorAll('.keyBtn')) b.disabled = !online;
  for (const id of ['typeBox', 'typeBtn', 'clipBox', 'clipSendBtn', 'clipReadBtn']) $(id).disabled = !online;
}

// ---------- live view ----------
$('watchBtn').onclick = startLive;
$('stopBtn').onclick = () => stopLive(true);
$('audioBtn').onclick = () => { if (live && live.audio) stopAudio(); else startAudio(); };
$('volume').addEventListener('input', () => { if (audioGain) audioGain.gain.value = $('volume').value / 100; });

async function startLive() {
  if (!selId) return;
  const sessionId = 'web_' + uuid().replace(/-/g, '').slice(0, 20);
  live = { deviceId: selId, sessionId, ws: null, stop: false, screenW: 0, screenH: 0, frames: 0, retries: 0, lastFrameAt: 0, bytes: 0, audio: null };
  syncButtons(); showOverlay('Stream shuru ho rahi hai…');
  try {
    const res = await command('screen', 'screen.watch_live', { session_id: sessionId, fps: Number($('fps').value), quality: $('quality').value }, 20000);
    if (res.screen) { live.screenW = res.screen.width; live.screenH = res.screen.height; }
    if (res.first_frame_received === false) showOverlay('Stream chalu — screen static hai, change hote hi frame aayega');
    await connectWs();
  } catch (e) {
    const code = e.data && e.data.error_code;
    toast(code === 'PERMISSION_REQUIRED' ? 'Phone par Screen capture consent do (Permission Center → Screen capture).' : 'Live shuru nahi hui: ' + errText(e), 'err');
    live = null; hideStage(); syncButtons();
  }
}
async function connectWs() {
  if (!live || live.stop) return;
  const t = await api('POST', '/admin/ws-ticket');
  const url = base.replace(/^http/, 'ws') + '/screen/' + encodeURIComponent(live.sessionId) + '?ticket=' + encodeURIComponent(t.ticket);
  const ws = new WebSocket(url); ws.binaryType = 'blob'; live.ws = ws;
  ws.onopen = () => { live.retries = 0; $('empty').style.display = 'none'; $('screen').style.display = 'block'; };
  ws.onmessage = (ev) => {
    live.frames++; live.lastFrameAt = performance.now();
    const blob = typeof ev.data === 'string'
      ? dataUriToBlob(ev.data)
      : (ev.data instanceof Blob ? ev.data : new Blob([ev.data], { type: 'image/jpeg' }));
    live.bytes += blob.size || 0;
    onFrame(blob);
  };
  ws.onclose = () => {
    if (!live || live.stop || live.ws !== ws) return;
    if (++live.retries > 6) { toast('Live stream toot gayi — dobara Watch Live dabaiye', 'err'); stopLive(false); return; }
    showOverlay('Reconnect ho raha hai… (' + live.retries + ')');
    setTimeout(() => connectWs().catch(() => {}), Math.min(1000 * live.retries, 5000));
  };
  ws.onerror = () => {};
}
function dataUriToBlob(s) {
  const i = s.indexOf(','); const bin = atob(s.slice(i + 1));
  const u8 = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
  return new Blob([u8], { type: 'image/jpeg' });
}
async function stopLive(sendStop) {
  const l = live; if (!l) return; l.stop = true; live = null;
  try { l.ws && l.ws.close(); } catch {}
  await stopAudio(l, sendStop);
  if (sendStop && token) { try { await command('screen', 'screen.stop_live', { session_id: l.sessionId }, 8000); } catch {} }
  hideStage(); syncButtons();
}
function hideStage() { $('screen').style.display = 'none'; $('empty').style.display = ''; $('overlay').style.display = 'none'; }
function showOverlay(t) { const o = $('overlay'); o.textContent = t; o.style.display = ''; }

// Frame pipeline: createImageBitmap (hardware-decoded, main thread block nahi
// hoti jaisi Image+dataURL se hoti) + sirf latest frame rakhte hain (purane
// frame drop — lag jama nahi hota, hamesha "abhi" dikhta hai).
const canvas = $('screen'), ctx = canvas.getContext('2d', { alpha: false });
let latestBlob = null, decoding = false;
function onFrame(blob) { latestBlob = blob; if (!decoding) decodeNext(); }
async function decodeNext() {
  if (!latestBlob) return; const b = latestBlob; latestBlob = null; decoding = true;
  try {
    const bmp = await createImageBitmap(b);
    if (canvas.width !== bmp.width || canvas.height !== bmp.height) { canvas.width = bmp.width; canvas.height = bmp.height; }
    ctx.drawImage(bmp, 0, 0); bmp.close(); $('overlay').style.display = 'none';
  } catch {}
  decoding = false; decodeNext();
}
let lastFramesSeen = 0, lastStatsAt = performance.now(), fpsNow = 0, kbps = 0, lastBytes = 0;
function updateStats() {
  const now = performance.now();
  if (live) {
    const dt = (now - lastStatsAt) / 1000;
    if (dt >= 0.9) { fpsNow = (live.frames - lastFramesSeen) / dt; kbps = (live.bytes - lastBytes) / 1024 / dt; lastFramesSeen = live.frames; lastBytes = live.bytes; lastStatsAt = now; }
    const age = live.lastFrameAt ? (now - live.lastFrameAt) / 1000 : null;
    $('stats').textContent = fpsNow.toFixed(1) + ' fps · ' + kbps.toFixed(0) + ' KB/s' + (pendingCmds ? ' · ' + pendingCmds + ' cmd' : '') + (age != null && age > 4 ? ' · ' + age.toFixed(0) + 's se naya frame nahi' : '');
  } else { $('stats').textContent = pendingCmds ? pendingCmds + ' cmd pending' : '—'; lastFramesSeen = 0; lastBytes = 0; }
}

// ---------- audio (system audio, PCM16 16kHz mono) ----------
// Web Audio ka ScriptProcessorNode (deprecated par har browser mein kaam
// karta hai, AudioWorklet module load karne ki zaroorat nahi — CSP ko
// simple rakhta hai). Ek chhota jitter-buffer queue, underflow par chup
// (crash nahi), overflow par purane samples drop (lag jama nahi hota).
let audioCtx = null, audioGain = null, audioNode = null;
let pcmQueue = new Float32Array(0);
const AUDIO_MAX_QUEUED_SAMPLES = 16000 * 2; // ~2s — isse zyada = purana audio, drop karo

function ensureAudioGraph() {
  if (audioCtx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  try { audioCtx = new Ctx({ sampleRate: 16000 }); } catch { audioCtx = new Ctx(); }
  audioGain = audioCtx.createGain();
  audioGain.gain.value = $('volume').value / 100;
  audioGain.connect(audioCtx.destination);
  audioNode = audioCtx.createScriptProcessor(2048, 0, 1);
  audioNode.onaudioprocess = (ev) => {
    const out = ev.outputBuffer.getChannelData(0);
    const n = Math.min(out.length, pcmQueue.length);
    out.set(pcmQueue.subarray(0, n));
    if (n < out.length) out.fill(0, n); // underflow => silence, not noise
    pcmQueue = pcmQueue.subarray(n);
  };
  audioNode.connect(audioGain);
}
function pcmPush(int16Buf) {
  // Device 16kHz PCM bhejta hai; agar AudioContext us rate par nahi khula
  // (kuch browsers constructor option ignore karte hain), to resample
  // karna padta — simple linear interpolation, chhoti si CPU lagti hai par
  // sirf tab chalta hai jab zaroorat ho.
  const i16 = new Int16Array(int16Buf);
  let f32 = new Float32Array(i16.length);
  for (let k = 0; k < i16.length; k++) f32[k] = i16[k] / 32768;
  if (audioCtx && audioCtx.sampleRate !== 16000) {
    const ratio = audioCtx.sampleRate / 16000;
    const out = new Float32Array(Math.round(f32.length * ratio));
    for (let k = 0; k < out.length; k++) {
      const srcPos = k / ratio, i0 = Math.floor(srcPos), frac = srcPos - i0;
      out[k] = f32[i0] * (1 - frac) + (f32[i0 + 1] ?? f32[i0]) * frac;
    }
    f32 = out;
  }
  const merged = new Float32Array(pcmQueue.length + f32.length);
  merged.set(pcmQueue); merged.set(f32, pcmQueue.length);
  pcmQueue = merged.length > AUDIO_MAX_QUEUED_SAMPLES
    ? merged.subarray(merged.length - AUDIO_MAX_QUEUED_SAMPLES) // bahut peeche reh gaye to kaato
    : merged;
}

async function startAudio() {
  if (!live || live.audio) return;
  ensureAudioGraph();
  try { await audioCtx.resume(); } catch {}
  try {
    await command('audio', 'audio.watch_live', { session_id: live.sessionId }, 15000);
  } catch (e) {
    const code = e.data && e.data.error_code;
    toast(code === 'CAPABILITY_UNAVAILABLE' ? 'Audio sirf Android 10+ par supported hai.' : 'Audio shuru nahi hui: ' + errText(e), 'err');
    return;
  }
  const l = live; if (!l) return;
  l.audio = { ws: null, retries: 0, stop: false };
  syncButtons();
  await connectAudioWs(l);
}
async function connectAudioWs(l) {
  if (!l || !l.audio || l.audio.stop || live !== l) return;
  const t = await api('POST', '/admin/ws-ticket');
  const url = base.replace(/^http/, 'ws') + '/audio/' + encodeURIComponent(l.sessionId) + '?ticket=' + encodeURIComponent(t.ticket);
  const ws = new WebSocket(url); ws.binaryType = 'arraybuffer'; l.audio.ws = ws;
  ws.onopen = () => { l.audio.retries = 0; };
  ws.onmessage = (ev) => { if (ev.data instanceof ArrayBuffer) pcmPush(ev.data); };
  ws.onclose = () => {
    if (!l.audio || l.audio.stop || l.audio.ws !== ws) return;
    if (++l.audio.retries > 6) { l.audio = null; syncButtons(); return; }
    setTimeout(() => connectAudioWs(l).catch(() => {}), Math.min(1000 * l.audio.retries, 5000));
  };
  ws.onerror = () => {};
}
async function stopAudio(target, sendStop) {
  const l = target || live; const a = l && l.audio; if (!a) return;
  a.stop = true;
  try { a.ws && a.ws.close(); } catch {}
  if (l) l.audio = null;
  pcmQueue = new Float32Array(0);
  if (sendStop !== false && l && token) { try { await command('audio', 'audio.stop_live', { session_id: l.sessionId }, 8000); } catch {} }
  syncButtons();
}

// ---------- touch (mouse/touch -> device) ----------
let down = null;
canvas.addEventListener('pointerdown', (e) => { if (!live) return; canvas.setPointerCapture(e.pointerId); down = { x: e.clientX, y: e.clientY, t: performance.now() }; e.preventDefault(); });
canvas.addEventListener('pointerup', (e) => {
  if (!down || !live) return; const d = down; down = null;
  const dist = Math.hypot(e.clientX - d.x, e.clientY - d.y), dur = performance.now() - d.t;
  const a = toDevice(d.x, d.y), b = toDevice(e.clientX, e.clientY);
  if (dist < 10 && dur < 600) command('input', 'input.tap', { x: a.x, y: a.y }, 8000).catch((er) => toast('Tap fail: ' + errText(er), 'err'));
  else command('input', 'input.swipe', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, duration_ms: Math.max(100, Math.min(2000, Math.round(dur))) }, 10000).catch((er) => toast('Swipe fail: ' + errText(er), 'err'));
  e.preventDefault();
});
canvas.addEventListener('pointercancel', () => { down = null; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
function toDevice(cx, cy) {
  const r = canvas.getBoundingClientRect();
  const w = (live && live.screenW) || canvas.width, h = (live && live.screenH) || canvas.height;
  return { x: Math.round(Math.min(1, Math.max(0, (cx - r.left) / r.width)) * w), y: Math.round(Math.min(1, Math.max(0, (cy - r.top) / r.height)) * h) };
}

// ---------- keys / text / clipboard ----------
for (const b of document.querySelectorAll('.keyBtn')) b.onclick = () => command('input', 'input.key', { key: b.dataset.key }, 8000).catch((e) => toast('Key fail: ' + errText(e), 'err'));
$('typeBtn').onclick = sendType;
$('typeBox').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendType(); });
function sendType() {
  const t = $('typeBox').value; if (!t) return;
  command('input', 'input.type_text', { text: t, append: $('appendChk').checked }, 10000)
    .then(() => { $('typeBox').value = ''; toast('Text device par gaya', 'ok'); })
    .catch((e) => toast('Type fail: ' + errText(e), 'err'));
}
$('clipSendBtn').onclick = () => {
  const t = $('clipBox').value; if (!t) return;
  command('clipboard', 'clipboard.write', { text: t }, 10000)
    .then(() => toast('Device ke clipboard mein copy ho gaya — ab wahan paste karein', 'ok'))
    .catch((e) => toast('Clipboard fail: ' + errText(e), 'err'));
};
$('clipReadBtn').onclick = () => {
  command('clipboard', 'clipboard.read', {}, 10000).then((r) => {
    const t = r && (r.text != null ? r.text : r.clipboard);
    if (t == null || t === '') return toast('Device ka clipboard khaali ya Android ne background read block kiya (Android 10+)', 'err');
    $('clipBox').value = t; toast('Device ka clipboard yahan aa gaya', 'ok');
  }).catch((e) => toast('Clipboard read fail: ' + errText(e), 'err'));
};
window.addEventListener('beforeunload', () => { if (live) { try { live.ws.close(); } catch {} try { live.audio && live.audio.ws && live.audio.ws.close(); } catch {} } try { ctl && ctl.close(); } catch {} });
</script>
